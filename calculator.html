<html>
<head>
  <title>simple calculator</title>
  <style> <!-- it comes under the internal CSS--> 
    input[type="button"]
    {
      width:100%;
      height:100%;
      font-size:18px;
    }
    input[type="text"]
    {
      width:100%;
      height:40px;
      font-size:18px;
      text-align:left;
    }
    Table{
    width:100px;
    height:40px;
    border-collapse:collapse;
   }
   th
   {
      padding:2px;
   }
  </style>
 </head>
 <body>
 <script>
   function data(val)
   {
      document.getElementById("a").value+=val;
    }
    function clr()
    {
      document.getElementById("a").value=" ";
    }
    function solve()
    {
       let x=document.getElementById("a").value;
       let y=eval(x);
       document.getElementById("a").value=y;
    }
  </script>
  <h2 align="center">Calculator</h2>
  <table align="center" border="6">
  <tr>
  <th colspan="3">
  <input type="text" id="a" readonly></th>
    <th><input type="button" value="c" onclick="clr()"></th>
   </tr>
   <tr>
     <th><input type="button" value="1" onclick="data('1')"></th>
     <th><input type="button" value="2" onclick="data('2')"></th>
     <th><input type="button" value="3" onclick="data('3')"></th>
     <th><input type="button" value="/" onclick="data('/')"></th>
   </tr>
   <tr>
     <th><input type="button" value="4" onclick="data('4')"></th>
     <th><input type="button" value="5" onclick="data('5')"></th>
     <th><input type="button" value="6" onclick="data('6')"></th>
     <th><input type="button" value="*" onclick="data('*')"></th>
   </tr>
   <tr>
     <th><input type="button" value="7" onclick="data('7')"></th>
     <th><input type="button" value="8" onclick="data('8')"></th>
     <th><input type="button" value="9" onclick="data('9')"></th>
     <th><input type="button" value="-" onclick="data('-')"></th>
   </tr>
   <tr>
     <th><input type="button" value="." onclick="data('.')"></th>
     <th><input type="button" value="0" onclick="data('0')"></th>
     <th><input type="button" value="=" onclick=solve()></th>
     <th><input type="button" value="+" onclick="data('+')"></th>
   </tr>
  </body>
 </html>
